# DRC 30x30 spatial optimization scenario 02
# Baseline = existing protected areas (PAs) + CFCLs (Concessions Forestieres de
# Communautes Locales, Local Community Forest Concessions), assuming all CFCLs are
# eventually recognized as OECMs. Both count towards 30% and are locked in.
# All seven themes balanced (equal share of 1 each), with the STAR species layer.

extends:
- "configs/common/defaults.yml"
- "configs/common/themes.yml"

name: "PAs+CFCLs as baseline - Balanced"
baseline: "PAs+CFCLs as baseline"

data:
  protected_classes:
  - "protected_frac"
  - "cfcl_frac"

species:
  include: true

weighting:
  priority: {}

optimization:
  extra_constraint_cols: []
