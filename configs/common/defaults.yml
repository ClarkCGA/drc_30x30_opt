# Defaults shared by every scenario config (merged before the scenario's own keys).

data:
  # Planning-unit table. Convert the CSV once with
  #   python -m scripts.convert_to_parquet
  # If the Parquet file is missing, the CSV with the same name is read instead.
  file_path: "data/drc_1km_data_planning_units.parquet"
  protected_th: 0.8
  # Planning-unit size (m); used to build the rook adjacency from x_native/y_native.
  cell_size: 1000

species:
  # STAR species layer: wide Parquet keyed by grid_id with one sp_<id_no>
  # column per species (values already include IUCN category weights), and
  # the matching species table (id_no, name, class, category, weight,
  # global_km2, drc_km2, source). Both are produced by the STAR pipeline in
  # drc_30x30_data_prep. Can be overridden per run with the DRC_STAR_PATH /
  # DRC_STAR_SPECIES_TABLE environment variables.
  star_path: "data/star/star_1km_species.parquet"
  species_table: "data/star/star_species.csv"
  # Memory budget (MB) for one batch of species columns while summing.
  memory_budget_mb: 512

optimization:
  protection_frac: 0.30

  # Connectivity: reward (in score units) for every pair of adjacent selected
  # planning units (sharing a 1 km edge). 0 disables it. w = 0.25 roughly
  # halves the outer boundary of the selection for ~1.3% of the theme score
  # (see docs/METHODS_NOTES.md).
  connectivity:
    weight: 0.25

  solver:
    # "mincut": exact parametric min-cut (scipy), handles the full grid.
    # "cbc": PuLP/CBC integer program (same objective); only practical on
    #        subsets when connectivity is on, kept for verification.
    method: "mincut"
    # CBC settings
    time_limit: 2000
    gap_rel: 0.001
    threads: 20
    # Min-cut settings: score resolution (1/scale) and bisection tolerance
    mincut_scale: 1000000
    mincut_tol: 0.000001

  # Exclusion rules shared by all scenarios: a planning unit is ineligible
  # when the column value exceeds the threshold. Oil blocks are NOT excluded
  # (their overlap with new areas is reported in output/scenario_summary.csv).
  constraint_cols:
  - ["dense_urban_cluster_frac", 0.3]
  - ["low_density_rural_frac", 0.8]
  - ["rural_cluster_frac", 0.8]
  - ["semidense_urban_cluster_frac", 0.3]
  - ["suburban_periurban_frac", 0.3]
  - ["TMF_deforested_frac", 0.3]
  - ["TMF_degraded_frac", 0.3]
  - ["urban_center_frac", 0.3]
